# Minimal RoboStack ROS 2 Humble environment for CI (compile and test only;
# SE-MPPI's control performance on Humble's MPPI 1.1.x is not evaluated).
# Versions are pinned to the environment verified on 2026-10-05.
# xsimd is pinned to 7.x: xtensor 0.23 does not compile against newer xsimd,
# and the solver would otherwise pick one (see CMakeLists.txt, boundary 1).
name: ros2
channels:
  - robostack-staging
  - conda-forge
dependencies:
  - ros2-distro-mutex=0.9.0=humble_18
  - python=3.12
  - ros-humble-ros-base=0.10.0
  - ros-humble-nav2-mppi-controller=1.1.20
  - ros-humble-nav2-controller=1.1.20
  - ros-humble-nav2-core=1.1.20
  - ros-humble-nav2-costmap-2d=1.1.20
  - ros-humble-diagnostic-msgs=4.9.1
  - ros-humble-lifecycle-msgs=1.2.2
  - ros-humble-ament-cmake-gtest=1.3.14
  - ros-humble-ament-lint-auto=0.12.15
  - ros-humble-ament-lint-common=0.12.15
  - cppcheck=2.22.0       # pinned so the cppcheck test result does not change between runs
  - xtensor=0.23.9
  - xsimd=7.6.0
  - osqp-eigen=0.11.0
  - libosqp=1.0.0
  - eigen=3.4.0
  - colcon-common-extensions=0.3.0
  - colcon-core=0.19.0
  - cxx-compiler=1.11.0   # GCC 14: Humble's vendored gtest 1.10 does not build with GCC 15
  - gxx=14.3
  - cmake=4.2.3
  - ninja=1.13.2
  - pkg-config=0.29.2
  - pyyaml=6.0.3
