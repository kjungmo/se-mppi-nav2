# Nav2 + SE-MPPI parameters of CAMPAIGN 2 (experiments/campaign2/PREREG.md).
#
# Frozen before the first campaign-2 trial on the development or the held-out pocket: no value in
# this file changes after that (PREREG.md, "Fixed inputs"). The driver records
# the file's sha256 in every trial's meta.json.
#
# Derived from nav2_se_loopback.yaml ("set V" of campaign 1: the pilot's file
# with vx_min -0.35), with these differences, all listed here and nowhere else:
#   1. FollowPath.vx_min -0.35 (was 0.1): the robot can stop and reverse.
#   2. controller_server.failure_tolerance 0.0 (was -1.0): Nav2's default; the
#      first plugin failure aborts FollowPath. Campaign 1's "never abort" setting
#      was a June workaround.
#   3. progress_checker 0.5 m / 10.0 s (was 0.1 m / 120 s): Nav2's defaults.
#      Configurations C3 and C4 raise the time to 30 s (driver overlay,
#      experiments/campaign2/plan.py); that is the only other stall parameter.
#   4. bt_navigator default_nav_to_pose_bt_xml: Nav2's default tree (a byte copy,
#      nav_to_pose_default_recovery.xml) instead of the persistent tree. C3 and C4
#      use nav_to_pose_replanning_only.xml (driver overlay).
#   5. The escape parameters are written out (they equal the compiled defaults), and
#      EscapeCritic.gap_weight is 0. Only part of them are in DESIGN_ADVICE section 4.2.
#      The plugin adds, beyond the advised design: the exclusion of rays that lead to the
#      stall pose, to recent hop origins and to failed waypoints (se_escape_avoid_radius,
#      se_escape_avoid_hop_radius, se_escape_avoid_hops, a list of at most 6 failed
#      waypoints), a movement watchdog (se_escape_stall_time, se_escape_stall_distance), a
#      0.2 m floor on the waypoint distance and the use of se_gap_min_clearance on horizon
#      candidates. experiments/campaign2/PREREG.md ("Escape parameters and rules") lists every
#      key, says which are advised and where each value came from; the reason for each
#      addition is in docs/architecture/2026-10_escape-v2.md section 3.
# MPPI block (10 Hz, 28 steps, dt 0.1, batch 1500), inflation 0.45, critics
# and every other value are unchanged from nav2_se_loopback.yaml.
amcl:
  ros__parameters:
    # Near-zero motion noise: particles follow odometry exactly → no particle
    # diffusion to perceptually aliased positions in symmetric corridors.
    alpha1: 0.001
    alpha2: 0.001
    alpha3: 0.001
    alpha4: 0.001
    alpha5: 0.001
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 5000
    min_particles: 1000
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    # No random particle injection: with near-zero alpha, particles never drift;
    # injecting random particles would CREATE aliasing, not prevent it.
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.1
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.9
    z_max: 0.05
    z_rand: 0.05
    z_short: 0.0
    scan_topic: scan
    # Auto-localize at the tb3 world spawn so AMCL publishes map->odom on startup;
    # otherwise the navigation lifecycle races ahead of /initialpose and aborts on
    # the global_costmap TF timeout. Matches smoke_drive's default SE_START.
    set_initial_pose: true
    initial_pose:
      x: -2.0
      y: -0.5
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    # Server ack/service waits (ms). The stock 20 ms ack budget aborted live
    # trials on this loaded WSL2 host ("Timed out while waiting for action
    # server to acknowledge goal request for compute_path_to_pose" -> Goal
    # failed ~30 s in). 10 s absorbs executor stalls without masking real hangs.
    default_server_timeout: 10000
    wait_for_service_timeout: 10000
    action_server_result_timeout: 900.0
    # Campaign 2: Nav2's default tree for C1 and C2 (a byte copy of
    # navigate_to_pose_w_replanning_and_recovery.xml); C3 and C4 overlay
    # nav_to_pose_replanning_only.xml. Campaign 1 used the persistent tree.
    default_nav_to_pose_bt_xml: $(find-pkg-share se_mppi_utrap)/behavior_trees/nav_to_pose_default_recovery.xml
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    # 10 Hz (not 20) + model_dt 0.1 / time_steps 28 / batch 1500 below: the
    # host-fit MPPI budget this WSL2 machine sustains (per the live-run handoff);
    # the 20 Hz / 56-step / 2000-batch nominal config only reaches ~5 Hz here,
    # stalling the controller_server executor past the lifecycle bond timeout
    # (SERVER ... IS DOWN after 4000 ms) which tore the whole stack down mid-run.
    # Horizon is preserved at 2.8 s (28 * 0.1 == 56 * 0.05).
    controller_frequency: 10.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # Campaign 2: Nav2's default. The first plugin failure (for example
    # NoValidControl) aborts FollowPath; campaign 1 used -1 (never abort).
    failure_tolerance: 0.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "nav2_se_controller::SafeEscapeController"
      se_enabled: true
      verbose: true
      # Escape parameters (frozen; the compiled defaults). The first block is DESIGN_ADVICE
      # section 4.2; se_escape_stall_*, se_escape_avoid_* and the minimum clearance on horizon
      # candidates are additions of the plugin (PREREG.md, "Escape parameters and rules").
      se_enforce_rollout_check: true
      se_progress_stall_window: 30        # control cycles (3 s at 10 Hz)
      se_progress_min_advance: 0.10       # m, two costmap cells
      se_progress_adopt_advance: 0.5      # m
      se_escape_path_substitution: true
      se_escape_waypoint_cap: 2.5         # m
      se_escape_reselect_radius: 0.4      # m
      se_escape_reselect_period: 15.0     # s
      se_escape_stall_time: 3.0           # s
      se_escape_stall_distance: 0.15      # m
      se_escape_hysteresis: 0.5           # rad
      se_escape_avoid_radius: 1.0         # m
      se_escape_avoid_hop_radius: 0.6     # m
      se_escape_avoid_hops: 3
      se_gap_num_rays: 36
      se_gap_max_range: 2.0               # m
      se_gap_min_clearance: 0.6           # m
      time_steps: 28
      model_dt: 0.1
      batch_size: 1500
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      ay_min: -3.0
      az_max: 3.5
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 0.5
      vx_min: -0.35
      vy_max: 0.5
      wz_max: 1.9
      iteration_count: 1
      prune_distance: 1.7
      # 0.5 s absorbs the gz odom->base_footprint TF lag seen on WSL2 (sim clock
      # runs ahead of the bridged TF by up to ~0.2 s); 0.1 s tripped constant
      # "extrapolation into the future" and collision_monitor false-stops.
      transform_tolerance: 0.5
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic", "EscapeCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 2.0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 2.0
        max_angle_to_furthest: 1.0
        mode: 0
      TwirlingCritic:
        enabled: true
        twirling_cost_power: 1
        twirling_cost_weight: 2.0
      EscapeCritic:
        enabled: true
        always_on: false
        use_apf: true
        repulsion_weight: 2.0
        apf_influence_dist: 0.6
        use_gap_search: true
        # 0: the gap bearing no longer adds a cost term; the opening is reached
        # through the substituted escape path (code kept for ablation).
        gap_weight: 0.0
        progress_stall_window: 30

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.5   # absorb gz TF lag (WSL2 sim clock); see FollowPath
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.22
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 0.45 (was 0.25): with inflation ~ robot_radius the point-robot MPPI
        # cost band is razor thin and samples cut corners — the U-trap pilot
        # physically clipped a wall, rode up it (gz pitch 13.6 deg) and wheel
        # slip corrupted odom beyond AMCL recovery. Config-symmetric.
        # Note, 2026-10-11 (PR #6): that pilot (July 2026) ran on a
        # nav2_mppi_controller build with flipped rollouts (README, "Affected
        # nav2_mppi_controller builds"); for the earlier live tuning recorded
        # in this file's comments (MPPI budget, vx_min, timeouts) the build is
        # not recorded. Whether the defect caused the wall contact is not
        # established; the values have not been re-derived on a corrected build.
        inflation_radius: 0.45
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5   # absorb gz TF lag (WSL2 sim clock); see FollowPath
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45   # match local; keeps NavFn off the walls
      always_send_full_costmap: True

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# map_server:
#   ros__parameters:
#     yaml_filename: ""

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5   # absorb gz TF lag (WSL2 sim clock)
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

route_server:
  ros__parameters:
    # The graph_filepath does not need to be specified since it going to be set by defaults in launch.
    # If you'd rather set it in the yaml, remove the default "graph" value in the launch file(s).
    # file & provide full path to map below. If graph config or launch default is provided, it is used
    # graph_filepath: $(find-pkg-share nav2_route)/graphs/aws_graph.geojson
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: False
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 2.0]
    min_velocity: [-0.5, 0.0, -2.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.5   # absorb gz TF lag; 0.2 caused false "invalid source" stops
    # 5 s: scan on this host lags sim time by >1 s under load; at 1.0 s the
    # monitor declared the source invalid and zeroed cmd_vel mid-escape.
    source_timeout: 5.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: False  # smoke test: disable collision_monitor in tight sandbox
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

loopback_simulator:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan"  # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    update_duration: 0.02
    scan_range_min: 0.05
    scan_range_max: 30.0
    scan_angle_min: -3.1415
    scan_angle_max: 3.1415
    scan_angle_increment: 0.02617
    scan_use_inf: true

# NOTE on the lifecycle bond heartbeat: under heavy CPU load a managed node's
# executor can stall past the default 4 s bond, at which point the lifecycle
# manager declares it DOWN and tears the whole stack down mid-run (observed:
# controller_server / amcl "IS DOWN after 4000 ms" -> STUCK). This is NOT
# settable from a params file here: nav2_bringup's navigation_launch.py /
# localization_launch.py start the lifecycle managers with only {autostart,
# node_names} and do NOT pass configured_params, so a `lifecycle_manager_*:
# bond_timeout` key is ignored. The effective mitigation is the reduced MPPI
# compute budget above (10 Hz / 28 steps / 1500 batch), which keeps the
# controller_server executor responsive enough to stay under the 4 s bond.
