# Environment of the Python 2D mirror, the benchmark, its report and the campaign-2 analysis
# scripts (no ROS). Versions are those of the environment that wrote the committed data.
#   micromamba create -n semppi_mirror -f experiments/benchmark2d/environment.yml
name: semppi_mirror
channels:
  - conda-forge
dependencies:
  - python=3.12.13
  - numpy=2.4.6
  - pytest=9.1.1
  - pyyaml=6.0.3
  - pip
  - pip:
      - osqp==1.1.3
      - scipy==1.18.0
      - matplotlib==3.11.0
